<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>舞阪の風</title>
<style>
:root{--bg:#fff;--fg:#1f2328;--muted:#6b7280;--grid:#e5e7eb;--axis:#9ca3af;--line:#374151;
  --low:#7cc8ef;--mid:#f5cc2e;--high:#e5484d;--calm:#c4c8ce;--tide:#5b7a99;--night:#1f2a44;--swell0:#9ca3af;--j3:#22a35a;--j2:#9fdcb0;--j1:#f6c453;--j0:#e5e7eb}
@media (prefers-color-scheme:dark){:root{--bg:#16181c;--fg:#e6e8eb;--muted:#9aa1ab;--grid:#2c3037;
  --axis:#59606b;--line:#e6e8eb;--low:#5bb4e3;--mid:#e9bf20;--high:#ef5d61;--calm:#4b515a;--tide:#8fb0cf;--night:#000;--swell0:#6b7280;--j3:#2fb768;--j2:#2f6b45;--j1:#a07a1c;--j0:#33373e}}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif}
main{max-width:960px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:0 0 8px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
button,select{font:inherit;padding:4px 10px;border:1px solid var(--axis);border-radius:6px;background:var(--bg);color:var(--fg)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.sq{display:inline-block;width:10px;height:10px;background:var(--line);vertical-align:0;margin-right:4px}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--muted);font-size:11px}
#tip{position:fixed;pointer-events:none;background:var(--bg);border:1px solid var(--axis);border-radius:6px;
  padding:6px 8px;font-size:13px;display:none;box-shadow:0 2px 8px #0003}
#tideinfo{color:var(--muted)}
.summary{color:var(--muted);font-size:13px;margin-top:4px}
.criteria{color:var(--muted);font-size:13px;margin-top:16px;border-top:1px solid var(--grid)}
.criteria h2{font-size:14px;color:var(--fg);margin:12px 0 4px}.criteria ul{margin:4px 0;padding-left:20px}
svg{touch-action:pan-y}  /* 横になぞると時刻ごとの値が出る（縦スクロールは効く） */
@media (max-width:600px){main{padding:10px 8px}h1{font-size:16px}.legend{gap:4px 10px;font-size:11.5px}
  button,select{padding:4px 8px}#tideinfo{flex-basis:100%}}
</style></head><body><main>
<h1>舞阪灯台の風（30分ごと）</h1>
<div class="bar">
  <button id="prev">◀ 前日</button><select id="day"></select><button id="next">翌日 ▶</button><span id="tideinfo"></span>
</div>
<div class="legend">
  <span><b style="color:var(--fg)">村櫛の判定</b>
    <i class="sw" style="background:var(--j3)"></i>◎ <i class="sw" style="background:var(--j2)"></i>○
    <i class="sw" style="background:var(--j1)"></i>△ <i class="sw" style="background:var(--j0)"></i>× - 時間外</span>
  <span><i class="sw" style="background:var(--low)"></i>1〜7 m/s</span>
  <span><i class="sw" style="background:var(--mid)"></i>8〜12 m/s</span>
  <span><i class="sw" style="background:var(--high)"></i>13 m/s〜</span>
  <span><i class="sq"></i>風向（右軸）</span>
  <span><i class="sw" style="background:none;border:1.5px solid var(--axis)"></i>□ 予報の風（気象庁MSM）</span>
  <span><i class="sw" style="background:var(--calm);border-radius:50%"></i>風弱く</span>
  <span>☀️☁️🌧️ 浜松の天気・気温℃（薄い＝予報）</span>
  <span>➤ 舞阪沖のうねりの進む向き・波の高さ（GWAM・ECMWFの平均。予測値）：
    <span style="color:var(--swell0)">■</span>〜1m <span style="color:var(--low)">■</span>1〜2m
    <span style="color:var(--mid)">■</span>2〜3m <span style="color:var(--high)">■</span>3m〜</span>
  <span><i class="sw" style="background:var(--night);opacity:.15"></i>夜（日没〜日の出）</span>
  <span><i class="sw" style="background:var(--tide);opacity:.35"></i>村櫛の潮位</span>
  <span><i class="sw" style="background:none;border-top:2px solid var(--tide);border-radius:0;height:0;width:16px;vertical-align:3px"></i>舞阪の潮位（推算）</span>
</div>
<svg id="chart" role="img" aria-label="風速と風向のグラフ"></svg>
<div class="summary" id="summary"></div>
<div class="criteria" id="criteria"></div>
</main><div id="tip"></div>

  const range = (i) => { const lo = i ? SPEED_STEPS[i - 1][0] + 1 : 0, hi = SPEED_STEPS[i][0];
    return hi === Infinity ? `${lo} m/s〜` : `${lo}〜${hi} m/s`; };
  return `<h2>村櫛の判定基準</h2><ul>
  <li>時間: 日の出${MARGIN_MIN / 60}時間後〜日没${MARGIN_MIN / 60}時間前の枠だけ判定（準備・撤収の時間を除く）。それ以外は -</li>
  <li>風速（舞阪灯台）: ${SPEED_STEPS.map(([, r, why], i) => `${range(i)} ${MARKS[r]}（${why}）`).join('、')}。風弱くは ×</li>
  <li>風向: <ul>${DIR_GROUPS.map(([r, dirs, why]) => `<li>${MARKS[r]} ${dirs.join('・')}：${why}</li>`).join('')}</ul></li>
  <li>風速と風向の低いほうをその枠の判定にする</li>
  <li>潮の流れ（村櫛の上げ潮＝北向き、下げ潮＝南向き）: 風と同じ向きに流れるとパワーが落ちるので1段階下げる。東西の風（流れに対して横）で下げ潮は、流れで南（養殖棚側）へ流されやすいので注意表示</li>
  <li>天気: 雷なら ×</li>
  <li>最新の実測より後の時間（実測がまだ届いていない枠を含む）は風の予報（気象庁MSM、地上10m）で判定する（帯を薄く表示）。予報は灯台の実測より低めに出るので、風速を ${FCST_FACTOR} 倍して使う（暫定）。過去の欠測の枠は判定しない</li>
  <li>未反映: 水深（フィンが当たる潮位）・気温</li></ul>`;
}

function draw(day) {
  layout();
  const svg = svgEl; svg.innerHTML = '';
  const fs = NARROW ? 10 : 11;  // 小さい文字の大きさ
  const slots = Array(48).fill(null);
  for (const r of byDay[day] || []) slots[(+r.t.slice(11, 13)) * 2 + (+r.t.slice(14, 16) >= 30)] = r;
  // 最新の実測より後の枠は予報で埋める（時間が過ぎても実測が届くまでは予報のまま。夜間の取得しない時間も同じ）。
  // それより前で実測が無い枠は欠測なので空欄。風速は枠の中央の時刻で毎時値を補間して補正倍率をかけ、整数に丸める
  const fc = WIND_FCST[day] || [];
  const hm2 = n => `${String(Math.floor(n / 2)).padStart(2, '0')}:${n % 2 ? '30' : '00'}`;  // 枠の番号 → HH:MM
  for (let i = 0; i < 48; i++) {
    if (slots[i] || `${day}T${hm2(i)}` <= LAST_OBS_SLOT) continue;
    const m = i * 30 + 15, h0 = Math.floor(m / 60), f = (m - h0 * 60) / 60, a = fc[h0], b = fc[h0 + 1];
    if (!a || !b) continue;
    const raw = a[0] + (b[0] - a[0]) * f, d = (f < .5 ? a : b)[1];
    slots[i] = {t: `${day}T${hm2(i)}`, s: Math.round(raw * FCST_FACTOR), raw, d, ja: dir16(d), note: '', fc: true};
  }
  const smax = Math.max(15, ...slots.filter(r => r && r.s != null).map(r => Math.ceil(r.s) + 1));
  const sy = s => M.t + PH * (1 - s / smax);

  // 夜の帯（0時〜日の出、日没〜24時）と日の出・日没の時刻
  const hx = hm => M.l + PW * (+hm.slice(0, 2) * 60 + +hm.slice(3)) / 1440;
  const sun = SUN[day];
  if (sun) {
    const [rise, set] = sun.map(hx);
    for (const [a, b] of [[M.l, rise], [set, W - M.r]])
      el('rect', {x: a, y: M.t, width: b - a, height: PH, fill: 'var(--night)', opacity: .07}, svg);
    el('text', {x: clamp(rise, 34, W - 34), y: 11, 'text-anchor': 'middle'}, svg).textContent = `日の出 ${sun[0]}`;
    el('text', {x: clamp(set, 34, W - 34), y: 11, 'text-anchor': 'middle'}, svg).textContent = `日没 ${sun[1]}`;
  }

  // 浜松の天気アイコン（1時間＝2枠ぶんの中央。予報は薄く）
  const wx = WX[day] || [];
  wx.forEach((w, h) => {
    if (!w) return;
    const night = sun && (h + .5) * 60 < toMin(sun[0]) || sun && (h + .5) * 60 > toMin(sun[1]);
    const t = el('text', {x: M.l + (h * 2 + 1) * SLOT, y: M.t - (NARROW ? 70 : 74), 'text-anchor': 'middle',
      style: `font-size:${Math.min(16, SLOT * 2 - 1)}px;opacity:${w[1] === 'fcst' ? .4 : 1}`}, svg);
    t.textContent = wxIcon(w[0], night);
    el('title', {}, t).textContent = `${h}時 ${w[0]}（${w[1] === 'fcst' ? '予報' : '実測'}）`;
  });

  // 浜松の気温（波の下の行。予報は薄く）
  const tp = TEMP[day] || [];
  el('text', {x: M.l - 4, y: M.t - 30, 'text-anchor': 'end'}, svg).textContent = '℃';
  tp.forEach((v, h) => {
    if (!v || (NARROW && h % 3)) return;  // スマホは3時間ごと（予報の時刻と揃う）
    el('text', {x: M.l + (h * 2 + 1) * SLOT, y: M.t - 30, 'text-anchor': 'middle',
      style: `fill:var(--fg);font-size:${fs}px;opacity:${v[1] === 'fcst' ? .45 : .85}`}, svg)
      .textContent = Math.round(+v[0]);
  });

  // 村櫛のコンディション判定の帯（30分ごと）
  const judges = Array.from({length: 48}, (_, i) => judge(i, slots[i], TIDE[day], sun, wx));
  el('text', {x: M.l - 4, y: M.t - 8, 'text-anchor': 'end', style: `font-size:${fs}px`}, svg).textContent = '判定';
  judges.forEach((j, i) => {
    if (!j) return;
    const x = M.l + i * SLOT, y = M.t - 20;
    if (j.mark !== '-') el('rect', {x: x + .5, y, width: SLOT - 1, height: 15, rx: 2, fill: MARK_COLOR[j.rank], opacity: j.fc ? .5 : 1}, svg);
    if (j.mark === '-' || SLOT >= 13)
      el('text', {x: x + SLOT / 2, y: y + 11.5, 'text-anchor': 'middle',
        style: `font-size:${fs}px;fill:${j.mark === '-' ? 'var(--muted)' : 'var(--fg)'}`}, svg).textContent = j.mark;
  });

  // 舞阪沖の波（矢印はうねりの進む向き＝来る向き＋180°、色は総合の波高。現在より後は薄く）
  const sw = SWELL[day] || [];
  const nowKey = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 13);
  sw.forEach((v, h) => {
    if (!v || v[0] == null) return;
    const cx = M.l + (h * 2 + 1) * SLOT, cy = M.t - (NARROW ? 52 : 54);
    const future = `${day}T${String(h).padStart(2, '0')}` > nowKey;
    const k = Math.min(1, SLOT * 2 / 16);  // 1時間の幅に収まる大きさ
    const g = el('g', {transform: `translate(${cx},${cy}) rotate(${v[0] + 180}) scale(${k})`, opacity: future ? .7 : 1}, svg);
    el('path', {d: 'M0,-9 L6,1 L2,0 L2,9 L-2,9 L-2,0 L-6,1 Z', fill: swellColor(v[1])}, g);
    el('title', {}, g).textContent = `${h}時 うねり ${dir16(v[0])}から 波高${v[1]}m（${v[2]}）`;
  });

  // 横グリッドと左軸（風速）
  for (let s = 0; s <= smax; s += smax > 20 ? 5 : 2.5) {
    if (s % 1 && smax > 20) continue;
    el('line', {x1: M.l, x2: W - M.r, y1: sy(s), y2: sy(s), stroke: 'var(--grid)'}, svg);
    if (Number.isInteger(s) && (!NARROW || s % 5 === 0))
      el('text', {x: M.l - 4, y: sy(s) + 4, 'text-anchor': 'end'}, svg).textContent = s;
  }
  // 右軸（風向）
  for (const [lab, d] of [['E', 90], ['S', 180], ['W', 270], ['N', 360]])
    el('text', {x: W - M.r + (NARROW ? 4 : 8), y: dirY(d) + 4}, svg).textContent = lab;
  // 時刻軸
  el('line', {x1: M.l, x2: W - M.r, y1: sy(0), y2: sy(0), stroke: 'var(--axis)'}, svg);
  for (let h = 0; h <= 24; h += NARROW ? 6 : 3)
    el('text', {x: M.l + h * 2 * SLOT, y: H - (NARROW ? 6 : 10), 'text-anchor': 'middle'}, svg).textContent = `${h}時`;
  el('text', {x: 2, y: M.t + (NARROW ? 26 : 22), style: `font-size:${fs}px`}, svg).textContent = 'm/s';

  // 潮位（背景の面と、満潮・干潮の書き込み）
  const td = TIDE[day];
  document.getElementById('tideinfo').textContent = td ? `${td.name}　潮差 ${td.range} cm` : '';
  if (td) {
    const tx = i => M.l + PW * i / 144;
    const pts = lv => lv.map((v, i) => v == null ? null : `${tx(i)},${tideY(v)}`).filter(Boolean);
    const mk = pts(td.mk);
    el('path', {d: `M${tx(0)},${sy(0)}L${mk.join('L')}L${tx(144)},${sy(0)}Z`, fill: 'var(--tide)', opacity: .18}, svg);
    el('polyline', {points: pts(td.lv).join(' '), fill: 'none', stroke: 'var(--tide)', 'stroke-width': 1.5, opacity: .8}, svg);
  }

  // 風速の棒（上端だけ角丸）
  slots.forEach((r, i) => {
    if (!r) return;
    const gap = NARROW ? .75 : 2, x = M.l + i * SLOT + gap, w = SLOT - gap * 2;
    if (r.s != null && r.s > 0) {
      const y = sy(r.s), h = sy(0) - y, rr = Math.min(4, h, w / 2);
      const d = `M${x},${sy(0)}V${y + rr}Q${x},${y} ${x + rr},${y}H${x + w - rr}Q${x + w},${y} ${x + w},${y + rr}V${sy(0)}Z`;
      // 予報は枠線だけ（中を薄く塗る）
      el('path', r.fc ? {d, fill: color(r.s), 'fill-opacity': .18, stroke: color(r.s), 'stroke-width': NARROW ? 1 : 1.5} : {d, fill: color(r.s)}, svg);
    } else if (r.note) {
      el('circle', {cx: x + w / 2, cy: sy(0) - 4, r: NARROW ? 2 : 3, fill: 'var(--calm)'}, svg);
    }
  });

  // 風向の点（■。線では結ばない）
  const sq = NARROW ? 6 : 10;
  slots.forEach((r, i) => { if (r && r.d != null)
    el('rect', r.fc  // 予報は白抜きの□
      ? {x: M.l + (i + .5) * SLOT - sq / 2 + .75, y: dirY(r.d) - sq / 2 + .75, width: sq - 1.5, height: sq - 1.5, fill: 'var(--bg)', stroke: 'var(--line)', 'stroke-width': 1.5}
      : {x: M.l + (i + .5) * SLOT - sq / 2, y: dirY(r.d) - sq / 2, width: sq, height: sq, fill: 'var(--line)', stroke: 'var(--bg)', 'stroke-width': NARROW ? 1 : 1.5}, svg); });

  // 舞阪の満潮・干潮（線上の白抜きの点と時刻。村櫛と同じ書き方）
  for (const [hm, kind, cm] of td ? td.ev : []) {
    const x = hx(hm), y = tideY(cm), hi = kind === '満潮', half = NARROW ? 14 : 30;
    el('circle', {cx: x, cy: y, r: 3.5, fill: 'var(--bg)', stroke: 'var(--tide)', 'stroke-width': 1.5}, svg);
    el('text', {x: clamp(x, M.l + half, W - M.r - half), y: hi ? y - 9 : y + 17, 'text-anchor': 'middle',
      style: `fill:var(--tide);stroke:var(--bg);stroke-width:3px;paint-order:stroke;font-size:${fs}px`}, svg)
      .textContent = NARROW ? hm : `舞阪 ${hm}`;
  }

  // 村櫛の満潮・干潮（塗りの点と時刻。棒や■に隠れないよう最前面。文字に背景色の縁取り）
  for (const [hm, kind, cm] of td ? td.mkev : []) {
    const x = hx(hm), y = tideY(cm), hi = kind === '満潮';
    el('circle', {cx: x, cy: y, r: 3.5, fill: 'var(--tide)', stroke: 'var(--bg)', 'stroke-width': 1.5}, svg);
    const half = NARROW ? 14 : 30;
    el('text', {x: clamp(x, M.l + half, W - M.r - half), y: hi ? y - 9 : y + 17, 'text-anchor': 'middle',
      style: `fill:var(--tide);stroke:var(--bg);stroke-width:3px;paint-order:stroke;font-size:${fs}px`}, svg)
      .textContent = NARROW ? hm : `村櫛 ${hm}`;
  }

  // ホバー用の透明な枠
  slots.forEach((r, i) => {
    const hit = el('rect', {x: M.l + i * SLOT, y: M.t, width: SLOT, height: PH, fill: 'transparent'}, svg);
    const show = e => {
      const hh = String(Math.floor(i / 2)).padStart(2, '0'), mm = i % 2 ? '30' : '00';
      const k = Math.round((r ? +r.t.slice(11, 13) * 60 + +r.t.slice(14, 16) : i * 30 + 15) / 10);
      const w = wx[Math.floor(i / 2)];
      const tide = (td ? `<br>潮位 村櫛 ${td.mk[k] ?? '—'} cm / 舞阪 ${td.lv[k] ?? '—'} cm` : '')
        + (w ? `<br>浜松 ${w[0]}${w[1] === 'fcst' ? '（予報）' : ''}` : '')
        + ((t => t ? ` ${t[0]}℃${t[1] === 'fcst' ? '（予報）' : ''}` : '')(tp[Math.floor(i / 2)]))
        + ((j => j ? `<br><b>判定 ${j.mark}</b> <small>${j.why.join(' / ')}</small>` : '')(judges[i]))
        + ((v => v && v[0] != null ? `<br>波 ${v[1]}m（平均）うねり${dir16(v[0])}から<br><small>${v[2]}</small>` : '')(sw[Math.floor(i / 2)]));
      tip.innerHTML = r && r.fc ? `<b>${r.t.slice(11)}（予報）</b><br>風速 ${r.s} m/s <small>（MSM ${r.raw.toFixed(1)} m/s × ${FCST_FACTOR}）</small><br>風向 ${r.ja}${tide}`
                 : r ? `<b>${r.t.slice(11)}</b><br>風速 ${r.s != null ? r.s + ' m/s' : (r.note || '—')}<br>風向 ${r.ja || '—'}${tide}`
                        : `<b>${hh}:${mm}</b><br>データなし${tide}`;
      tip.style.display = 'block';
      tip.style.left = clamp(e.clientX + 12, 8, innerWidth - tip.offsetWidth - 8) + 'px';
      tip.style.top = (e.clientY + (e.pointerType === 'touch' ? -tip.offsetHeight - 16 : 12)) + 'px';  // 指で隠れないよう上に
    };
    hit.addEventListener('pointermove', show);
    hit.addEventListener('pointerdown', show);
    hit.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch') tip.style.display = 'none'; });
  });

  const vals = slots.filter(r => r && !r.fc && r.s != null).map(r => r.s);
  const n = slots.filter(r => r && !r.fc).length;
  document.getElementById('summary').textContent = n
    ? `${n}/48枠  最大 ${vals.length ? Math.max(...vals) : 0} m/s  平均 ${vals.length ? (vals.reduce((a, b) => a + b, 0) / n).toFixed(1) : 0} m/s（風弱くは0として計算）`
    : 'データなし';
}

// グラフ以外をタップしたら値の表示を消す。画面幅が変わったら描き直す
document.addEventListener('pointerdown', e => { if (!svgEl.contains(e.target)) tip.style.display = 'none'; });
let resizeTimer;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => draw(sel.value), 150); });
document.getElementById('criteria').innerHTML = criteriaHtml();
const go = i => { if (i >= 0 && i < days.length) { sel.selectedIndex = i; draw(days[i]); } };
sel.onchange = () => draw(sel.value);
document.getElementById('prev').onclick = () => go(sel.selectedIndex - 1);
document.getElementById('next').onclick = () => go(sel.selectedIndex + 1);
const today = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);  // JST
const want = new URLSearchParams(location.search).get('d') || today;  // chart.html?d=2026-10-06 で日付指定
go(days.includes(want) ? days.indexOf(want) : days.length - 1);
</script></body></html>
